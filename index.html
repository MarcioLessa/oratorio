const LivroOracoes = {
  comigo: false,
  rodada: 0,
  atual: null,   // índice da oração aberta (null = lista)

  iniciar() {
    Abas.aoEntrar.oracoes = () => this.mostrarLista();
  },

  area() { return $('#oracoes-conteudo'); },

  /** Lista de orações, agrupada (as essenciais primeiro). */
  mostrarLista() {
    this.parar();
    this.atual = null;
    $('#titulo-oracoes').textContent = 'Orações';
    let html = '';
    let aberto = false;
    LIVRO_ORACOES.forEach((o, i) => {
      if (o.grupo) {
        if (aberto) html += '</ul>';
        html += `<h3>${escapar(o.grupo)}</h3><ul class="lista-oracoes">`;
        aberto = true;
        return;
      }
      html += `<li><button type="button" class="botao secundario" data-oracao="${i}"><strong>${escapar(o.titulo)}</strong><small>${escapar(o.quando)}</small></button></li>`;
    });
    if (aberto) html += '</ul>';
    this.area().innerHTML = html;
    this.area().querySelectorAll('[data-oracao]').forEach((bt) => bt.addEventListener('click', () => this.abrir(Number(bt.dataset.oracao))));
  },

  /** Divide a oração em frases curtas, boas para repetir. */
  frases(texto) {
    const pedacos = texto.match(/[^,;:.!?]+[,;:.!?]*\s*/g) || [texto];
    const saida = [];
    pedacos.forEach((p) => {
      const t = p.trim();
      if (!t) return;
      // junta pedaços muito curtos ao anterior ("Amém.", "salve!")
      if (saida.length && (t.length < 14 || saida[saida.length - 1].length < 14) && (saida[saida.length - 1] + ' ' + t).length < 90) saida[saida.length - 1] += ' ' + t;
      else saida.push(t);
    });
    return saida;
  },

  /** Página de uma oração: como rezar, botões e o texto em letra grande. */
  abrir(indice) {
    this.parar();
    const o = LIVRO_ORACOES[indice];
    this.atual = indice;
    const frases = this.frases(o.texto);
    $('#titulo-oracoes').textContent = o.titulo;
    this.area().innerHTML = `
      <p class="quando-rezar">${escapar(o.quando)}</p>
      ${o.terco ? `<div class="grupo-botoes"><button type="button" class="botao" id="rezar-terco-completo">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
          <span>Rezar o terço completo</span></button></div>` : ''}
      <div class="grupo-botoes">
        <button type="button" class="botao${o.terco ? ' secundario' : ''}" id="rezar-comigo" data-rotulo="Rezar comigo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l3 3-3 3"/></svg>
          <span>Rezar comigo</span>
        </button>
        <button type="button" class="botao secundario" id="ouvir-oracao-livro" data-rotulo="Ouvir a oração inteira">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
          <span>Ouvir a oração inteira</span>
        </button>
      </div>
      <p class="aviso-repetir" id="aviso-repetir" aria-live="polite"></p>
      <p class="texto-oracao cartao">${frases.map((f, i) => `<span class="frase" data-frase="${i}">${escapar(f)}</span>`).join(' ')}</p>
      <div class="grupo-botoes">
        <button type="button" class="botao secundario" id="voltar-oracoes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          <span>Voltar às orações</span>
        </button>
      </div>`;
    window.scrollTo({ top: 0 });
    $('#titulo-oracoes').focus({ preventScroll: true });
    const area = this.area();
    area.querySelector('#ouvir-oracao-livro').addEventListener('click', (e) => { this.parar(); Voz.alternar(o.texto, e.currentTarget); });
    area.querySelector('#rezar-comigo').addEventListener('click', (e) => (this.comigo ? this.parar() : this.rezarComigo(frases, e.currentTarget)));
    area.querySelector('#voltar-oracoes').addEventListener('click', () => { this.mostrarLista(); window.scrollTo({ top: 0 }); });
    const terco = area.querySelector('#rezar-terco-completo');
    if (terco) terco.addEventListener('click', () => Terco.abrirMisericordia());
  },

  /** Lê uma frase, acende-a e espera a pessoa repetir; depois segue para a próxima. */
  async rezarComigo(frases, botao) {
    this.comigo = true;
    const rodada = ++this.rodada;
    const indice = this.atual;
    const segue = () => this.comigo && rodada === this.rodada && Abas.atual === 'oracoes' && this.atual === indice;
    botao.classList.add('falando');
    botao.querySelector('span').textContent = 'Parar';
    const aviso = $('#aviso-repetir');
    const spans = this.area().querySelectorAll('[data-frase]');
    const fator = { lenta: 1.25, normal: 1, rapida: 0.8, 'muito-rapida': 0.67, x175: 0.57, x2: 0.5 }[Voz.pref.velocidade] || 1.25;
    for (let i = 0; i < frases.length && segue(); i++) {
      spans.forEach((sp) => sp.classList.remove('atual'));
      spans[i].classList.add('atual');
      spans[i].scrollIntoView({ block: 'center', behavior: 'smooth' });
      aviso.textContent = 'Escute…';
      const r = await Voz.dizer(frases[i]);
      if (r === 'sem-voz') { this.comigo = false; Voz.semVoz(); break; }
      if (!r || !segue()) break;
      aviso.textContent = 'Agora repita';
      const espera = Math.max(2200, frases[i].length * 75 * fator);   // tempo para a pessoa repetir
      await new Promise((ok) => setTimeout(ok, espera));
    }
    if (rodada === this.rodada && this.atual === indice) {
      spans.forEach((sp) => sp.classList.remove('atual'));
      aviso.textContent = this.comigo ? 'Amém! Muito bem.' : '';
      botao.classList.remove('falando');
      botao.querySelector('span').textContent = botao.dataset.rotulo;
    }
    this.comigo = false;
  },

  parar() {
    const estava = this.comigo;
    this.comigo = false;
    this.rodada++;
    if (estava) Voz.parar();
    const area = this.area();
    const bt = area.querySelector('#rezar-comigo');
    if (bt) { bt.classList.remove('falando'); bt.querySelector('span').textContent = bt.dataset.rotulo; }
    const aviso = area.querySelector('#aviso-repetir');
    if (aviso) aviso.textContent = '';
    area.querySelectorAll('.frase.atual').forEach((sp) => sp.classList.remove('atual'));
  }
};

/* ---------------------------------------------------------------------
   8c. MINHAS NOVENAS — acompanha o dia de cada novena em andamento
   Cada novena guarda: santo, data de início e os dias já rezados.
   O dia de hoje é sempre o próximo dia ainda não rezado (1º a 9º).
   --------------------------------------------------------------------- */
const CHAVE_NOVENAS = 'oratorio.novenas';
const DIAS_EXTENSO = ['Primeiro', 'Segundo', 'Terceiro', 'Quarto', 'Quinto', 'Sexto', 'Sétimo', 'Oitavo', 'Nono'];
const DIAS_NOVENA = [
  ['Fé', 'Pedir fé viva a exemplo de {nome}'],
  ['Esperança', 'Entregar causas impossíveis'],
  ['Caridade', 'Amor aos pobres e sofredores'],
  ['Humildade', 'Reconhecer a grandeza de Deus'],
  ['Pureza', 'Coração limpo e intenções retas'],
  ['Fortaleza', 'Perseverança nas provações'],
  ['Obediência', 'Cumprir a vontade de Deus'],
  ['Oração', 'Vida de intimidade com Deus'],
  ['Santidade', 'Desejo de ser santo(a)']
];

const Novenas = {
  lista: Armazenamento.ler(CHAVE_NOVENAS, []),   // [{ id, inicio, feitos: ['AAAA-MM-DD'], concluida }]

  salvar() { Armazenamento.gravar(CHAVE_NOVENAS, this.lista); },
  santo(id) { return Santos.todos.find((s) => s.id === id); },
  emAndamento() { return this.lista.filter((n) => !n.concluida && this.santo(n.id)); },
  concluidas() { return this.lista.filter((n) => n.concluida && this.santo(n.id)).slice(-5).reverse(); },
  daSanto(id) { return this.lista.find((n) => n.id === id && !n.concluida); },
  hoje() { return isoData(new Date()); },
  rezouHoje(n) { return n.feitos.includes(this.hoje()); },
  /** Dia que a pessoa vai rezar (ou já rezou) hoje: 1 a 9. */
  diaAtual(n) { return Math.min(9, this.rezouHoje(n) ? n.feitos.length : n.feitos.length + 1); },

  /** Feminino para santas; o modelo da planilha usa "amigo(a)", "invocado(a)"... */
  ajustarGenero(texto, s) {
    const fem = /^(Santa|Beata|Nossa Senhora|Bem-aventurada|Santas)\b/.test(s.nome);
    return texto.replace(/amigo\(a\)/g, fem ? 'amiga' : 'amigo')
      .replace(/invocado\(a\)/g, fem ? 'invocada' : 'invocado')
      .replace(/protetor\(a\)/g, fem ? 'protetora' : 'protetor');
  },

  /** Monta as partes do dia: o que se reza todos os dias + o tema do dia. */
  partesDoDia(s, dia) {
    const inv = s.inv || 'intercessor geral, modelo de santidade e virtude cristã';
    const invMin = inv.toLowerCase();
    const [tema, pedido] = DIAS_NOVENA[dia - 1];
    const atoContricao = (LIVRO_ORACOES.find((o) => o.titulo === 'Ato de Contrição') || {}).texto || '';
    const partes = [
      { titulo: 'Sinal da Cruz', texto: ORACOES.sinal },
      { titulo: 'Ato de Contrição', texto: atoContricao },
      { titulo: 'Oração inicial', texto: `Ó ${s.nome}, fiel amigo(a) de Deus, venho a vós com confiança.` },
      { titulo: `${DIAS_EXTENSO[dia - 1]} dia · ${tema}`, texto: pedido.replace('{nome}', s.nome) + '.', destaque: true },
      { titulo: 'Ladainha (três vezes)', texto: `${s.nome}, modelo de ${invMin}, rogai por nós.` },
      { titulo: 'Seu pedido', texto: 'Agora, em silêncio, peça a graça que você deseja alcançar.' },
      { titulo: 'Oração final', texto: `Ó ${s.nome}, que sois invocado(a) como protetor(a) de ${invMin}, apresentai minha prece ao Coração de Jesus. Que por vossa intercessão eu alcance a graça que tanto necessito, se for para a glória de Deus e bem de minha alma. Amém.` },
      { titulo: 'Três Ave-Marias', texto: AVE_MARIA_TEXTO },
      { titulo: 'Glória ao Pai', texto: ORACOES.gloria }
    ];
    if (dia === 9) partes.push({ titulo: 'Encerramento', texto: `Participar da Missa e agradecer, mesmo antes de alcançar a graça, confiando na intercessão de ${s.nome}.`, destaque: true });
    return partes.map((p) => ({ ...p, texto: this.ajustarGenero(p.texto, s) }));
  },

  /** Texto para ouvir o dia inteiro (repete a Ladainha e a Ave-Maria 3 vezes). */
  textoParaOuvir(s, dia) {
    return this.partesDoDia(s, dia).map((p) => {
      if (p.titulo.startsWith('Ladainha')) return `Ladainha. ${p.texto} ${p.texto} ${p.texto}`;
      if (p.titulo === 'Três Ave-Marias') return `${p.texto} ${p.texto} ${p.texto}`;
      if (p.destaque) return `${p.titulo}. ${p.texto}`;
      return p.texto;
    }).join(' ').replace(/santo\(a\)/g, 'santo');
  },

  comecar(s) {
    let n = this.daSanto(s.id);
    if (!n) { n = { id: s.id, inicio: this.hoje(), feitos: [] }; this.lista.push(n); this.salvar(); this.atualizarHoje(); }
    this.irPara(n);
  },

  /** Abre a página do dia na aba Novenas. */
  irPara(n) {
    if (Modal.el.open) Modal.fechar();
    Abas.mostrar('novenas');
    this.abrirDia(n);
  },

  marcarRezado(n) {
    if (!this.rezouHoje(n)) n.feitos.push(this.hoje());
    if (n.feitos.length >= 9) n.concluida = this.hoje();
    this.salvar();
    this.atualizarHoje();
    if (n.concluida) this.mostrarConclusao(n); else this.abrirDia(n);
  },

  async desistir(n) {
    const s = this.santo(n.id);
    if (await Modal.confirmar('Encerrar esta novena?', `A novena a ${s.nome} sairá de Minhas Novenas.`, 'Encerrar', 'Continuar a novena')) {
      this.lista = this.lista.filter((x) => x !== n);
      this.salvar(); this.atualizarHoje();
      this.mostrarPagina();
    }
  },

  /** Bolinhas 1 a 9: rezado (✓), hoje (destacado) e futuros. */
  progressoHTML(n) {
    const dia = this.diaAtual(n);
    let html = '<ol class="progresso-novena" aria-label="Dias da novena">';
    for (let i = 1; i <= 9; i++) {
      const feito = i <= n.feitos.length;
      const atual = i === dia && !this.rezouHoje(n);
      html += `<li class="${feito ? 'feito' : ''}${atual ? ' atual' : ''}" aria-label="${DIAS_EXTENSO[i - 1]} dia${feito ? ', rezado' : atual ? ', hoje' : ''}">${feito ? '✓' : i}</li>`;
    }
    return html + '</ol>';
  },

  situacao(n) {
    const dia = this.diaAtual(n);
    if (this.rezouHoje(n)) return n.feitos.length >= 9 ? 'Novena concluída' : `Hoje já rezado ✓ · Amanhã: ${DIAS_EXTENSO[dia].toLowerCase()} dia`;
    return `Hoje: ${DIAS_EXTENSO[dia - 1].toLowerCase()} dia`;
  },

  area() { return $('#novenas-conteudo'); },

  /** Página da aba Novenas: em andamento, concluídas e começar uma nova. */
  mostrarPagina() {
    Voz.parar();
    $('#titulo-novenas').textContent = 'Minhas Novenas';
    this.area().innerHTML = this.secaoHTML() + `
      <section class="cartao" aria-labelledby="titulo-nova-novena">
        <h3 id="titulo-nova-novena" style="margin-top:0">Começar uma novena</h3>
        <label class="so-leitor" for="busca-novena">Digite o nome do Santo</label>
        <input class="campo-busca" id="busca-novena" type="search" placeholder="Nome do Santo" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <ul class="lista-oracoes" id="resultado-novena" style="margin-top:16px"></ul>
      </section>`;
    this.ligarBotoes(this.area());
    const campo = this.area().querySelector('#busca-novena');
    let espera;
    campo.addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(() => this.buscarSanto(campo.value), 220); });
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') campo.blur(); });
    this.buscarSanto('');
  },

  /** Sem texto: santos do dia. Com texto: busca entre todos os santos. */
  buscarSanto(texto) {
    const q = normalizar(texto);
    let lista;
    if (!q) lista = Santos.doDia(new Date()).slice(0, 4);
    else {
      const termos = q.split(/\s+/);
      lista = Santos.todos.filter((s) => termos.every((t) => s.busca.includes(t))).sort((a, b) => b.r - a.r).slice(0, 12);
    }
    const ul = this.area().querySelector('#resultado-novena');
    if (!ul) return;
    const titulo = q ? '' : '<li class="fonte-texto" style="margin:0">Santos de hoje:</li>';
    ul.innerHTML = titulo + (lista.length ? lista.map((s) => {
      const n = this.daSanto(s.id);
      return `<li><button type="button" class="botao secundario" data-comecar="${escapar(s.id)}"><strong>${escapar(s.nome)}</strong><small>${n ? `Continuar: ${DIAS_EXTENSO[this.diaAtual(n) - 1].toLowerCase()} dia` : 'Começar a novena'}</small></button></li>`;
    }).join('') : '<li class="aviso">Nenhum santo encontrado com esse nome.</li>');
    ul.querySelectorAll('[data-comecar]').forEach((bt) => bt.addEventListener('click', () => this.comecar(this.santo(bt.dataset.comecar))));
  },

  /** Lista das novenas em andamento (e as concluídas). */
  secaoHTML() {
    const ativas = this.emAndamento();
    let html = '<section class="cartao minhas-novenas" aria-labelledby="titulo-em-andamento"><h3 id="titulo-em-andamento" style="margin-top:0">Em andamento</h3>';
    if (!ativas.length) {
      html += '<p class="texto-leitura" style="white-space:normal;margin:0">Nenhuma novena em andamento. Escolha um santo logo abaixo para começar.</p>';
    } else {
      html += '<ul class="lista-oracoes">' + ativas.map((n) => {
        const s = this.santo(n.id);
        return `<li><button type="button" class="botao ${this.rezouHoje(n) ? 'secundario' : ''}" data-novena="${escapar(n.id)}"><strong>${escapar(s.nome)}</strong><small>${escapar(this.situacao(n))} · ${n.feitos.length} de 9 dias rezados</small></button></li>`;
      }).join('') + '</ul>';
    }
    const feitas = this.concluidas();
    if (feitas.length) {
      html += `<p class="fonte-texto">Concluídas: ${feitas.map((n) => escapar(this.santo(n.id).nome)).join('; ')}</p>`;
    }
    return html + '</section>';
  },

  ligarBotoes(raiz) {
    raiz.querySelectorAll('[data-novena]').forEach((bt) => bt.addEventListener('click', () => {
      const n = this.daSanto(bt.dataset.novena);
      if (n) this.irPara(n);
    }));
  },

  /** Página do dia da novena. */
  abrirDia(n) {
    Voz.parar();
    const s = this.santo(n.id);
    const dia = this.diaAtual(n);
    const ja = this.rezouHoje(n);
    $('#titulo-novenas').textContent = `Novena a ${s.nome}`;
    const ultimo = n.feitos[n.feitos.length - 1];
    const parado = ultimo && !ja && (new Date(this.hoje()) - new Date(ultimo)) / 86400000 > 1;
    const partes = this.partesDoDia(s, dia);
    this.area().innerHTML = `
      <div class="cabeca-novena">
        ${Santos.retratoHTML(s)}
        <p class="dia-novena-grande">${DIAS_EXTENSO[dia - 1]} dia</p>
        <p class="de-nove">${dia} de 9</p>
      </div>
      ${this.progressoHTML(n)}
      ${parado ? `<p class="aviso-novena">Você parou no ${DIAS_EXTENSO[n.feitos.length - 1].toLowerCase()} dia. Não tem problema: continue de onde parou.</p>` : ''}
      ${ja ? `<p class="aviso-novena">Você já rezou o ${DIAS_EXTENSO[dia - 1].toLowerCase()} dia hoje. Amanhã é o ${DIAS_EXTENSO[dia].toLowerCase()} dia.</p>` : ''}
      <div class="grupo-botoes">
        <button type="button" class="botao" id="ouvir-dia-novena" data-rotulo="Ouvir o ${DIAS_EXTENSO[dia - 1].toLowerCase()} dia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <span>Ouvir o ${DIAS_EXTENSO[dia - 1].toLowerCase()} dia</span>
        </button>
      </div>
      <div class="novena">
        ${partes.map((p) => `<div class="parte-novena${p.destaque ? ' destaque' : ''}"><h3>${escapar(p.titulo)}</h3><p class="texto-leitura" style="white-space:normal">${escapar(p.texto)}</p></div>`).join('')}
      </div>
      <div class="grupo-botoes">
        ${ja ? '' : `<button type="button" class="botao" id="marcar-dia-novena">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span>Rezei o ${DIAS_EXTENSO[dia - 1].toLowerCase()} dia</span></button>`}
        <button type="button" class="botao secundario" id="voltar-novenas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          <span>Voltar às novenas</span></button>
        <button type="button" class="botao secundario" id="desistir-novena"><span>Encerrar esta novena</span></button>
      </div>`;
    window.scrollTo({ top: 0 });
    $('#titulo-novenas').focus({ preventScroll: true });
    const area = this.area();
    area.querySelector('#ouvir-dia-novena').addEventListener('click', (e) => Voz.alternar(this.textoParaOuvir(s, dia), e.currentTarget));
    const marcar = area.querySelector('#marcar-dia-novena');
    if (marcar) marcar.addEventListener('click', () => { Voz.parar(); this.marcarRezado(n); });
    area.querySelector('#voltar-novenas').addEventListener('click', () => { this.mostrarPagina(); window.scrollTo({ top: 0 }); });
    area.querySelector('#desistir-novena').addEventListener('click', () => this.desistir(n));
  },

  mostrarConclusao(n) {
    const s = this.santo(n.id);
    Modal.abrir(`
      ${Santos.retratoHTML(s)}
      <h2 id="modal-titulo">Novena concluída</h2>
      <p class="texto-leitura" style="text-align:center;white-space:normal">Você rezou os nove dias da novena a ${escapar(s.nome)}. Participe da Missa e agradeça, mesmo antes de alcançar a graça.</p>`,
      [{ rotulo: 'Amém', acao: () => { this.mostrarPagina(); window.scrollTo({ top: 0 }); } }]);
  },

  /** Lembrete na aba Hoje: novenas que ainda faltam rezar hoje. */
  atualizarHoje() {
    const alvo = $('#hoje-novenas');
    if (!alvo) return;
    const pendentes = this.emAndamento().filter((n) => !this.rezouHoje(n));
    if (!pendentes.length) { alvo.hidden = true; alvo.innerHTML = ''; return; }
    alvo.hidden = false;
    alvo.innerHTML = '<h3 style="margin-top:0">Sua novena de hoje</h3><ul class="lista-oracoes">' + pendentes.map((n) => {
      const s = this.santo(n.id);
      return `<li><button type="button" class="botao" data-novena="${escapar(n.id)}"><strong>${DIAS_EXTENSO[this.diaAtual(n) - 1]} dia</strong><small style="color:inherit">${escapar(s.nome)}</small></button></li>`;
    }).join('') + '</ul>';
    this.ligarBotoes(alvo);
  }
};

/* ---------------------------------------------------------------------
   9. ABA BÍBLIA — leitura de biblia.json {livro, capitulo, versiculo, texto}
   --------------------------------------------------------------------- */
const CHAVE_BIBLIA = 'oratorio.biblia';

const Biblia = {
  carregada: false,
  livros: [],        // [{ nome, capitulos: Map<número, [{v, t}]> }]

  iniciar() {
    Abas.aoEntrar.biblia = () => { if (!this.carregada && !this.carregando) this.carregar(); };
    $('#sel-livro').addEventListener('change', () => { this.preencherCapitulos(); this.preencherVersiculos(); this.mostrar(); });
    $('#sel-capitulo').addEventListener('change', () => { this.preencherVersiculos(); this.mostrar(); });
    $('#sel-versiculo').addEventListener('change', () => this.mostrar());
    $('#botao-ouvir-capitulo').addEventListener('click', (e) => this.ouvir(e.currentTarget));
    $('#botao-cap-anterior').addEventListener('click', () => this.mudarCapitulo(-1));
    $('#botao-cap-proximo').addEventListener('click', () => this.mudarCapitulo(1));
    $('#arquivo-biblia').addEventListener('change', (e) => this.lerArquivo(e.target.files[0]));
  },

  status(html) { $('#biblia-carregando').innerHTML = html; },

  /**
   * Ordem de tentativa:
   * 1) biblia.json via fetch (site/servidor ou app instalado)
   * 2) biblia.js via <script> (funciona abrindo o arquivo direto, sem servidor)
   * 3) cópia guardada no aparelho (IndexedDB)
   * 4) a pessoa escolhe o arquivo biblia.json
   */
  async carregar() {
    this.carregando = true;
    this.tentou = true;
    this.status('Abrindo a Bíblia…');
    let dados = null;
    try { const r = await fetch('biblia.json'); if (r.ok) dados = await r.json(); } catch { /* segue */ }
    if (!dados) dados = await this.carregarScript('biblia.js');
    if (!dados) dados = await BancoLocal.ler('biblia');
    this.carregando = false;
    if (dados) { this.preparar(dados); return; }

    this.status('<p>Não foi possível abrir o arquivo da Bíblia.</p>');
    const bt = document.createElement('button');
    bt.type = 'button'; bt.className = 'botao';
    bt.innerHTML = '<span>Escolher arquivo biblia.json</span>';
    bt.addEventListener('click', () => $('#arquivo-biblia').click());
    $('#biblia-carregando').appendChild(bt);
  },

  carregarScript(src) {
    return new Promise((resolver) => {
      if (window.BIBLIA_DADOS) { resolver(window.BIBLIA_DADOS); return; }
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolver(window.BIBLIA_DADOS || null);
      s.onerror = () => resolver(null);
      document.head.appendChild(s);
    });
  },

  async lerArquivo(arquivo) {
    if (!arquivo) return;
    this.status('Abrindo a Bíblia…');
    try {
      const dados = JSON.parse(await arquivo.text());
      await BancoLocal.gravar('biblia', dados);
      this.preparar(dados);
    } catch {
      this.status('');
      Modal.mensagem('Arquivo inválido', 'O arquivo escolhido não é uma Bíblia no formato esperado (biblia.json).');
      this.carregar();
    }
  },

  /** Organiza a lista plana de versículos em livros e capítulos. */
  preparar(dados) {
    const lista = Array.isArray(dados) ? dados : (dados.versiculos || dados.biblia || []);
    const porNome = new Map();
    lista.forEach((v) => {
      if (!v || !v.livro) return;
      let livro = porNome.get(v.livro);
      if (!livro) { livro = { nome: v.livro, capitulos: new Map() }; porNome.set(v.livro, livro); this.livros.push(livro); }
      const cap = Number(v.capitulo);
      if (!livro.capitulos.has(cap)) livro.capitulos.set(cap, []);
      livro.capitulos.get(cap).push({ v: Number(v.versiculo), t: v.texto });
    });
    if (!this.livros.length) { this.status('<p>A Bíblia está vazia.</p>'); return; }
    this.carregada = true;
    this.status('');

    // Seletor de livros, separado em Antigo e Novo Testamento
    const sel = $('#sel-livro');
    sel.innerHTML = '';
    const grupos = [document.createElement('optgroup'), document.createElement('optgroup')];
    grupos[0].label = 'Antigo Testamento'; grupos[1].label = 'Novo Testamento';
    // O Novo Testamento começa no Evangelho de São Mateus (vale para qualquer Bíblia carregada)
    const inicioNT = this.livros.findIndex((l) => /Mateus/.test(l.nome) && /Evangelho/.test(l.nome));
    this.livros.forEach((l, i) => {
      const o = new Option(this.nomeCurto(l.nome), String(i));
      (inicioNT > 0 && i >= inicioNT ? grupos[1] : grupos[0]).appendChild(o);
    });
    sel.appendChild(grupos[0]);
    if (grupos[1].children.length) sel.appendChild(grupos[1]);

    // Volta ao último ponto de leitura (padrão: Evangelho de São João, 1)
    const salvo = Armazenamento.ler(CHAVE_BIBLIA);
    const padrao = this.livros.findIndex((l) => /João/.test(l.nome) && /Evangelho/.test(l.nome));
    // procura pelo nome (a ordem dos livros pode mudar entre versões da Bíblia)
    const idxSalvo = salvo && salvo.nome ? this.livros.findIndex((l) => l.nome === salvo.nome) : -1;
    sel.value = String(idxSalvo >= 0 ? idxSalvo : Math.max(0, padrao));
    this.preencherCapitulos(salvo && salvo.capitulo);
    this.preencherVersiculos(salvo && salvo.versiculo);
    $('#biblia-seletores').hidden = false;
    this.mostrar(false);
  },

  /** Nome curto para caber no seletor (o título completo aparece na leitura). */
  nomeCurto(nome) {
    return nome
      .replace(/^Evangelho segundo São /, 'Evangelho · ')
      .replace(/^(I|II) Livro d(?:e|o|a|os|as) /, '$1 ')
      .replace(/^Livro d(?:e|o|a|os|as) /, '')
      .replace(/^Primeira Epístola (?:aos|a|de São) /, '1 ')
      .replace(/^Segunda Epístola (?:aos|a|de São) /, '2 ')
      .replace(/^Terceira Epístola (?:aos|a|de São) /, '3 ')
      .replace(/^Epístola (?:de São Paulo )?(?:aos|a|de São) /, '');
  },

  livroAtual() { return this.livros[Number($('#sel-livro').value)]; },

  preencherCapitulos(escolhido) {
    const sel = $('#sel-capitulo');
    const caps = [...this.livroAtual().capitulos.keys()];
    sel.innerHTML = caps.map((c) => `<option value="${c}">${c}</option>`).join('');
    sel.value = String(caps.includes(Number(escolhido)) ? escolhido : caps[0]);
  },

  preencherVersiculos(escolhido) {
    const sel = $('#sel-versiculo');
    const vs = this.livroAtual().capitulos.get(Number($('#sel-capitulo').value)) || [];
    sel.innerHTML = vs.map((x) => `<option value="${x.v}">${x.v}</option>`).join('');
    sel.value = String(vs.some((x) => x.v === Number(escolhido)) ? escolhido : (vs[0] ? vs[0].v : ''));
  },

  versiculosVisiveis() {
    const vs = this.livroAtual().capitulos.get(Number($('#sel-capitulo').value)) || [];
    const inicio = Number($('#sel-versiculo').value) || 1;
    return vs.filter((x) => x.v >= inicio);
  },

  /** Mostra o texto a partir do versículo escolhido, em letra extra-grande. */
  mostrar(rolar = true) {
    Voz.parar();
    const livro = this.livroAtual();
    const cap = Number($('#sel-capitulo').value);
    const vs = this.versiculosVisiveis();
    const art = $('#biblia-leitura');
    art.innerHTML = `<h3>${escapar(livro.nome)}, ${cap}</h3>` +
      vs.map((x) => `<p><sup>${x.v}</sup>${escapar(x.t)}</p>`).join('');
    art.hidden = false;
    $('#biblia-navegacao').hidden = false;

    const caps = [...livro.capitulos.keys()];
    const idxLivro = Number($('#sel-livro').value);
    $('#botao-cap-anterior').disabled = idxLivro === 0 && cap === caps[0];
    $('#botao-cap-proximo').disabled = idxLivro === this.livros.length - 1 && cap === caps[caps.length - 1];

    Armazenamento.gravar(CHAVE_BIBLIA, { livro: idxLivro, nome: this.livros[idxLivro].nome, capitulo: cap, versiculo: Number($('#sel-versiculo').value) });
    if (rolar) art.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },

  /** Garante que a Bíblia esteja carregada (usado pelo Evangelho do calendário). */
  garantir() {
    if (this.carregada) return Promise.resolve(true);
    if (!this.espera) {
      this.espera = new Promise((resolver) => {
        const verificar = () => { if (this.carregada) resolver(true); else if (!this.carregando && this.tentou) resolver(false); else setTimeout(verificar, 150); };
        if (!this.carregando) { this.tentou = true; this.carregar(); }
        verificar();
      }).then((ok) => { if (!ok) this.espera = null; return ok; });
    }
    return this.espera;
  },

  /** Devolve os versículos de um trecho: partes = [[cap, vIni, capFim, vFim], ...]. */
  trecho(nomeLivro, partes) {
    const livro = this.livros.find((l) => l.nome === nomeLivro);
    if (!livro) return [];
    const saida = [];
    partes.forEach(([c1, v1, c2, v2]) => {
      for (let c = c1; c <= c2; c++) {
        (livro.capitulos.get(c) || []).forEach((x) => {
          if ((c > c1 || x.v >= v1) && (c < c2 || x.v <= v2)) saida.push({ c, v: x.v, t: x.t });
        });
      }
    });
    return saida;
  },

  /** Capítulo anterior/próximo (passa para o livro seguinte quando precisa). */
  mudarCapitulo(direcao) {
    let idxLivro = Number($('#sel-livro').value);
    let caps = [...this.livros[idxLivro].capitulos.keys()];
    let pos = caps.indexOf(Number($('#sel-capitulo').value)) + direcao;
    if (pos < 0) {
      if (idxLivro === 0) return;
      idxLivro--; caps = [...this.livros[idxLivro].capitulos.keys()]; pos = caps.length - 1;
    } else if (pos >= caps.length) {
      if (idxLivro === this.livros.length - 1) return;
      idxLivro++; caps = [...this.livros[idxLivro].capitulos.keys()]; pos = 0;
    }
    $('#sel-livro').value = String(idxLivro);
    this.preencherCapitulos(caps[pos]);
    this.preencherVersiculos();
    this.mostrar();
  },

  ouvir(botao) {
    const livro = this.livroAtual();
    const cap = $('#sel-capitulo').value;
    const texto = this.versiculosVisiveis().map((x) => x.t).join(' ');
    Voz.alternar(`${livro.nome}, capítulo ${cap}. ${texto}`, botao);
  }
};

/** IndexedDB mínimo: guarda a Bíblia escolhida manualmente pelo usuário. */
const BancoLocal = {
  abrir() {
    return new Promise((ok, erro) => {
      if (!('indexedDB' in window)) { erro(); return; }
      const req = indexedDB.open('oratorio', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('dados');
      req.onsuccess = () => ok(req.result);
      req.onerror = () => erro(req.error);
    });
  },
  async ler(chave) {
    try {
      const db = await this.abrir();
      return await new Promise((ok) => {
        const r = db.transaction('dados').objectStore('dados').get(chave);
        r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null);
      });
    } catch { return null; }
  },
  async gravar(chave, valor) {
    try {
      const db = await this.abrir();
      await new Promise((ok) => {
        const tx = db.transaction('dados', 'readwrite');
        tx.objectStore('dados').put(valor, chave);
        tx.oncomplete = ok; tx.onerror = ok;
      });
    } catch { /* sem armazenamento disponível */ }
  }
};

/* ---------------------------------------------------------------------
   10. Inicialização + PWA (service worker para funcionar offline)
